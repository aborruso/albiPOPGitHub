name: crea feed RSS c_a638

on:
#  push:
  repository_dispatch:
  schedule:
  - cron:  '30 7,19 * * *'
  workflow_dispatch:

jobs:
  scheduled:
    runs-on: ubuntu-latest
    # la fonte rifiuta le connessioni da parte degli IP dei runner: se va
    # male non è un errore da segnalare, ci prova il job "ritenta"
    outputs:
      ok: ${{ steps.feed.outcome == 'success' }}
    steps:
    - name: Utilizza l'action github checkout@v2, per automatizzare il check-out
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: crea cartella utente bin, copia dentro l'eseguibile di miller e scrape, installa xmlstarlet
      run: |-
        mkdir -p ~/bin
        cp bin/mlr ~/bin
        cp bin/scrape ~/bin
        cp bin/rsspls ~/bin
        cd ~/bin
        chmod +x mlr
        chmod +x scrape
        chmod +x rsspls
        sudo apt-get install xmlstarlet
        pip install --user yq
    - name: scarica i dati e crea feed
      id: feed
      continue-on-error: true
      env:
        SCW_PROXY_TOKEN: ${{ secrets.SCW_PROXY_TOKEN }}
        SCW_PROXY_URL: ${{ secrets.SCW_PROXY_URL }}
      run: |-
        export PATH=$PATH:~/bin
        cd ./c_a638
        chmod +x ./c_a638.sh
        ./c_a638.sh
    - name: Committa e pusha se ci sono variazioni nei dati
      if: steps.feed.outcome == 'success'
      run: |-
        git config user.name "automatico"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date --iso-8601=seconds)
        git commit -m "c_a638, Barcellona Pozzo di Gotto: ${timestamp}" || exit 0
        git pull --rebase
        git push

  # secondo tentativo su un runner nuovo: è l'unico modo di cambiare IP,
  # perché ritentare sullo stesso runner dà sempre lo stesso esito
  ritenta:
    needs: scheduled
    if: needs.scheduled.outputs.ok != 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Utilizza l'action github checkout@v2, per automatizzare il check-out
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: crea cartella utente bin, copia dentro l'eseguibile di miller e scrape, installa xmlstarlet
      run: |-
        mkdir -p ~/bin
        cp bin/mlr ~/bin
        cp bin/scrape ~/bin
        cp bin/rsspls ~/bin
        cd ~/bin
        chmod +x mlr
        chmod +x scrape
        chmod +x rsspls
        sudo apt-get install xmlstarlet
        pip install --user yq
    - name: scarica i dati e crea feed
      env:
        SCW_PROXY_TOKEN: ${{ secrets.SCW_PROXY_TOKEN }}
        SCW_PROXY_URL: ${{ secrets.SCW_PROXY_URL }}
      run: |-
        export PATH=$PATH:~/bin
        cd ./c_a638
        chmod +x ./c_a638.sh
        ./c_a638.sh
    - name: Committa e pusha se ci sono variazioni nei dati
      run: |-
        git config user.name "automatico"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date --iso-8601=seconds)
        git commit -m "c_a638, Barcellona Pozzo di Gotto: ${timestamp}" || exit 0
        git pull --rebase
        git push
